<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 90" width="40" height="90">
  <!-- Hoja de la katana -->
  <polygon points="20,2 24,70 16,70" fill="#c8d8e8" stroke="#8aa0b8" stroke-width="0.5"/>
  <!-- Filo brillante -->
  <polygon points="20,2 22,70 20,65" fill="#e8f4ff" opacity="0.8"/>
  <!-- Tsuba (guarda) -->
  <ellipse cx="20" cy="70" rx="10" ry="4" fill="#c8a030" stroke="#a07820" stroke-width="1"/>
  <!-- Tsuka (empuñadura) -->
  <rect x="17" y="70" width="6" height="18" rx="2" fill="#2a1a0a" stroke="#5a3a1a" stroke-width="0.5"/>
  <!-- Vendaje de la empuñadura -->
  <line x1="17" y1="74" x2="23" y2="74" stroke="#8b6a30" stroke-width="1.5"/>
  <line x1="17" y1="78" x2="23" y2="78" stroke="#8b6a30" stroke-width="1.5"/>
  <line x1="17" y1="82" x2="23" y2="82" stroke="#8b6a30" stroke-width="1.5"/>
  <!-- Kashira (pommel) -->
  <ellipse cx="20" cy="88" rx="4" ry="2" fill="#c8a030"/>
  <!-- Brillo de la hoja -->
  <line x1="20" y1="5" x2="21" y2="60" stroke="white" stroke-width="0.8" opacity="0.4"/>
</svg>