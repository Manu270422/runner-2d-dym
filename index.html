<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Runner 2D Pro - DyM</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1abc9c">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

  <style>
    :root {
      --bg: #0f1115;
      --panel: #151922;
      --border: #2a2f3a;
      --text: #ffffff;
    }
    html, body {
      height: 100%; margin: 0; background: var(--bg); color: var(--text);
      font-family: monospace; overflow: hidden;
      user-select: none; /* Evita seleccionar texto accidentalmente */
      
      /* Evita el "rebote" elástico al hacer scroll en móviles */
      overscroll-behavior: none; 
    }
    .game-wrap {
      display: grid; place-items: center; height: 100%; padding: 12px; box-sizing: border-box;
    }
    .game-panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      max-width: 100%; max-height: 100%; display: flex; flex-direction: column;
    }
    canvas {
      display: block; 
      background: #1a1d24; 
      border: 1px solid #2a2f3a;
      
      /* Look Retro / Pixel Art */
      image-rendering: pixelated; 
      
      width: 100%; 
      height: auto; 
      
      /* OPTIMIZACIÓN MÓVIL Y GPU */
      touch-action: none; /* Vital: Desactiva gestos del navegador */
      transform: translateZ(0); /* Fuerza aceleración de GPU */
      will-change: transform; 
    }
    .hint {
      margin-top: 8px; font-size: 12px; opacity: 0.6; text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="game-panel">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="hint">Controles: Espacio / W / Toque para saltar</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
